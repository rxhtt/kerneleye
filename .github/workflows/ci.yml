name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Rust & eBPF Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Set up Nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, rustfmt

      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall

      - name: Install bpf-linker
        run: cargo binstall --no-confirm bpf-linker

      - name: Format Check
        run: cargo +nightly fmt --all -- --check

      - name: Build Userspace Daemon
        run: cargo check -p exec-snoop -p exec-snoop-common

  python-sdk:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK & Run Tests
        run: |
          cd bindings/python
          pip install -e .
          python tests/test_sdk.py
