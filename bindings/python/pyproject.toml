[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kerneleye"
version = "0.1.0"
description = "Kernel-enforced eBPF LSM runtime confinement middleware for AI coding agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "rxhtt" }]
keywords = ["ebpf", "lsm", "ai-agents", "security", "sandboxing", "confinement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/rxhtt/kerneleye"
